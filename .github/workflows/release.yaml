name: Release
on:
  push:
    tags:
      - '*'
permissions:
  contents: read
jobs:
  Source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      extension-name: ${{ steps.metadata.outputs.extension-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Verify project is initialized
        run: |
          if ! test -f "composer.json"; then
            echo "Error: composer.json not found, run 'pskel init' before tagging a release." >&2
            exit 1
          fi
      - name: Archive prepared extension
        run: tar -cf "${RUNNER_TEMP}/release-ext.tar" "ext"
      - name: Upload prepared extension
        uses: actions/upload-artifact@v7
        with:
          name: release-ext
          path: ${{ runner.temp }}/release-ext.tar
          retention-days: 1
      - name: Extract release metadata
        id: metadata
        run: |
          EXT_NAME="$(jq -r '."php-ext"."extension-name" // empty' "composer.json")"
          if test -z "${EXT_NAME}"; then
            echo "Error: php-ext.extension-name not found in composer.json." >&2
            exit 1
          fi
          echo "extension-name=${EXT_NAME}" >> "${GITHUB_OUTPUT}"
      - name: Create source package
        id: source
        env:
          EXT_NAME: ${{ steps.metadata.outputs.extension-name }}
        run: |
          SRC_ARCHIVE_PATH="${RUNNER_TEMP}/php_${EXT_NAME}-${GITHUB_REF_NAME}-src.tgz"
          git archive --format="tar.gz" --prefix="${EXT_NAME}-${GITHUB_REF_NAME#v}/" --output "${SRC_ARCHIVE_PATH}" HEAD
          echo "archive-path=${SRC_ARCHIVE_PATH}" >> "${GITHUB_OUTPUT}"
      - name: Create draft GitHub release and upload source package
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_ARCHIVE_PATH: ${{ steps.source.outputs.archive-path }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --draft --notes-from-tag --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" "${SRC_ARCHIVE_PATH}" --clobber
  Linux:
    needs: Source
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    env:
      PSKEL_BUILD_TARGET: builder
    strategy:
      fail-fast: false
      matrix:
        runs-on: ['ubuntu-24.04', 'ubuntu-24.04-arm']
        version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        ts: ['cli', 'zts']
        distro: ['trixie', 'alpine']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Remove checked-out extension sources
        run: rm -rf "ext"
      - name: Download prepared extension
        uses: actions/download-artifact@v8
        with:
          name: release-ext
          path: ${{ runner.temp }}/release-ext
      - name: Extract prepared extension
        run: tar -xf "${RUNNER_TEMP}/release-ext/release-ext.tar" -C "${GITHUB_WORKSPACE}"
      - name: Build PIE pre-packaged binary
        run: |
          docker compose build \
            --build-arg TAG="${{ matrix.version }}-${{ matrix.ts }}-${{ matrix.distro }}" \
            shell
          mkdir -p "dist"
          docker compose run -v "$(pwd)/dist:/dist" --rm shell pskel package "${GITHUB_REF_NAME}" /dist "${{ needs.Source.outputs.extension-name }}"
      - name: Upload PIE pre-packaged binary to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
  macOS:
    needs: Source
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        runs-on: ['macos-15', 'macos-15-intel']
        version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        ts: ['ts', 'nts']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Remove checked-out extension sources
        run: rm -rf "ext"
      - name: Download prepared extension
        uses: actions/download-artifact@v8
        with:
          name: release-ext
          path: ${{ runner.temp }}/release-ext
      - name: Extract prepared extension
        run: tar -xf "${RUNNER_TEMP}/release-ext/release-ext.tar" -C "${GITHUB_WORKSPACE}"
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.version }}
          extensions: none
        env:
          phpts: ${{ matrix.ts }}
      - name: Build and upload PIE pre-packaged binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "dist"
          ./pskel.sh package "${GITHUB_REF_NAME}" "dist" "${{ needs.Source.outputs.extension-name }}"
          gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
  Windows:
    needs: Source
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        arch: ['x64', 'x86']
        ts: ['ts', 'nts']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Remove checked-out extension sources
        shell: pwsh
        run: Remove-Item -LiteralPath .\ext -Recurse -Force
      - name: Download prepared extension
        uses: actions/download-artifact@v8
        with:
          name: release-ext
          path: ${{ runner.temp }}/release-ext
      - name: Extract prepared extension
        shell: pwsh
        run: tar -xf "$env:RUNNER_TEMP\release-ext\release-ext.tar" -C "$env:GITHUB_WORKSPACE"
      - name: Stage extension source for Windows builder
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath .\ext -Force | Copy-Item -Destination . -Recurse -Force
      - name: Build extension
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --enable-${{ needs.Source.outputs.extension-name }}
          run-tests: 'false'
  Upload_Windows:
    needs:
      - Source
      - Windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Upload Windows binaries to the draft release
        uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: 'true'
  AddDebPackages:
    needs: Source
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            dockerfile: build/ubuntu2204/Dockerfile
            image: colopl-timeshifter-u2204-php81
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            dockerfile: build/ubuntu2204/Dockerfile
            image: colopl-timeshifter-u2204-php81
          - runs-on: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            dockerfile: build/ubuntu2204_sury84/Dockerfile
            image: colopl-timeshifter-u2204-sury84-php84
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            dockerfile: build/ubuntu2204_sury84/Dockerfile
            image: colopl-timeshifter-u2204-sury84-php84
          - runs-on: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            dockerfile: build/ubuntu2604/Dockerfile
            image: colopl-timeshifter-u2604-php85
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            dockerfile: build/ubuntu2604/Dockerfile
            image: colopl-timeshifter-u2604-php85
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build Debian packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACTS_DIR="${RUNNER_TEMP}/artifacts"
          mkdir -p "${ARTIFACTS_DIR}"
          docker build \
            --pull \
            --build-arg PLATFORM="${{ matrix.platform }}" \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.image }}:${{ matrix.arch }}" \
            .
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -e VERSION="${VERSION}" \
            -v "${ARTIFACTS_DIR}:/tmp/artifacts" \
            "${{ matrix.image }}:${{ matrix.arch }}"
      - name: Upload Debian packages to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/artifacts/"* --clobber
  PublishRelease:
    needs:
      - Linux
      - macOS
      - Upload_Windows
      - AddDebPackages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${{ github.repository }}"

